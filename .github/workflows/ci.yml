name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only the team step is given this database. Every other step runs with none, which is how the demo must work.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: assay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium --with-deps
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (Vitest browser mode, Chromium)
        run: pnpm test
      - name: Golden-set evaluation (fails on a rule-check regression)
        run: pnpm eval
      - name: Build
        run: pnpm build
      - name: E2E and accessibility (Playwright, Chromium)
        run: pnpm e2e
      - name: Team server against a real Postgres
        run: pnpm test:team
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/assay_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
